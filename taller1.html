<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ficha de Formulario</title>
    <link rel="stylesheet" href="diseño.css">
</head>

<body>

<div class="ficha-contenido">
    <h1>FICHA DE FORMULARIO</h1>

    <form>
        <label>Nombre:</label>
        <input type="text">

        <label>Correo:</label>
        <input type="email">

        <label>Programa:</label>
        <select>
            <option>Programación</option>
            <option>Desarrollo Web</option>
            <option>Base de Datos</option>
        </select>

        <button type="submit">Enviar</button>
    </form>
</div>

</body>
</html>
